name: Supabase Migrate

# Aplica migraciones a producción automáticamente cuando se mergea a main
# y hay cambios en supabase/migrations/.
#
# Secrets requeridos en GitHub → Settings → Secrets → Actions:
#   SUPABASE_ACCESS_TOKEN  — supabase.com → Account → Access Tokens
#   SUPABASE_PROJECT_ID    — ref del proyecto (ej: abcdefghijklmnop)
#   SUPABASE_DB_PASSWORD   — contraseña elegida al crear el proyecto

on:
  push:
    branches: [main, master]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  migrate:
    name: Apply migrations
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          # Versión fija: `latest` consulta la API de GitHub (falla por rate limit) y un
          # cambio de comportamiento del CLI puede romper el despliegue sin tocar este archivo.
          version: 3.1.0

      - name: Link Supabase project
        run: supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Apply migrations to production
        # --yes: desde el CLI 3.x, `db push` a producción pide confirmación y en un runner
        # no hay terminal para responder (falla con "Confirmation required ... Re-run with --yes").
        run: supabase db push --linked --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
