name: Sync package-lock.json

on:
  pull_request:
    branches: [main, master]      # ✅ Fix menor: filtro de branches
    paths:
      - 'package.json'

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GIT_HUB_PAT }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'        # ✅ Consistente con ci.yml / deploy.yml
          cache: 'npm'              # ✅ Cache para reducir tiempo de ejecución

      - name: Check if lock file is in sync
        id: check
        run: |
          npm install
          if git diff --quiet package-lock.json; then
            echo "needs_update=false" >> $GITHUB_OUTPUT   # ✅ Semántica correcta
          else
            echo "needs_update=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated lock file
        if: steps.check.outputs.needs_update == 'true'   # ✅ Variable renombrada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: sync package-lock.json"
          git push
